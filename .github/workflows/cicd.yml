name: Build, Test, and Deploy App

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_URL:  ${{ secrets.POSTGRES_URL }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: brewview
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 for x64
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: x64
          cache: maven

      - name: Change into Brewview directory
        run: cd Brewview

      - name: Install dependencies
        run: mvn clean install

      - name: Build project
        run: mvn package

      - name: Run tests
        run: mvn test

  # QA deployment job
  deploy-to-qa:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    needs: build-and-test
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: Brewview
          push: true
          tags: ghcr.io/matthew-maya-17/Brewview/app:staging

  # Production deployment job
  deploy-to-production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build-and-test
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull ghcr.io/matthew-maya-17/Brewview/app:staging

      - name: Tag Docker image for production
        run: docker tag ghcr.io/matthew-maya-17/Brewview/app:staging ghcr.io/matthew-maya-17/Brewview/app:latest

      - name: Push Docker image to production
        run: docker push ghcr.io/matthew-maya-17/Brewview/app:latest